<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual dinámico – Cámara de inspección y escucha de fugas</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14202e;--mut:#5a6878;--ac:#0b4f8a;--ac2:#e8f1fa;--bd:#cdd8e4;--wn:#fff4d6;--wnb:#e0a800;--ok:#1b8a4b;--bad:#c0392b;--mid:#d98b00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#16222f;--tx:#e6edf5;--mut:#9fb0c2;--ac:#6db3f2;--ac2:#1b2d41;--bd:#2c3d50;--wn:#3a3115;--wnb:#b58900;--ok:#46c37b;--bad:#ef6b5b;--mid:#f0b040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#16222f;--tx:#e6edf5;--mut:#9fb0c2;--ac:#6db3f2;--ac2:#1b2d41;--bd:#2c3d50;--wn:#3a3115;--wnb:#b58900;--ok:#46c37b;--bad:#ef6b5b;--mid:#f0b040;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header.hero{background:var(--ac);color:#fff;padding:22px 16px 18px}
:root[data-theme="dark"] header.hero{color:#06223d}
.wrap{max-width:1000px;margin:0 auto}
.hero h1{margin:0 0 4px;font-size:clamp(20px,4.5vw,30px);line-height:1.2}
.hero p{margin:2px 0;opacity:.92;font-size:14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:4px;padding:6px 10px;overflow-x:auto}
nav.tabs button{flex:1;min-width:max-content;border:0;background:none;color:var(--mut);font:600 14px inherit;padding:10px 14px;border-radius:8px;cursor:pointer}
nav.tabs button.on{background:var(--ac2);color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button.b{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
input[type=search]{flex:1;min-width:180px}
button.b{cursor:pointer;font-weight:600;color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] button.p{color:#06223d}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;padding:13px 14px;font-weight:700;color:var(--ac);display:flex;justify-content:space-between;gap:8px;align-items:center;list-style-position:inside}
summary .bd{font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 9px;white-space:nowrap}
.body{padding:2px 14px 14px}
.body h4{margin:14px 0 6px;font-size:15px}
.body p{margin:6px 0}
.body ul{margin:6px 0;padding-left:20px}
figure{margin:12px 0;text-align:center}
figure img{max-width:100%;max-height:340px;border-radius:10px}
figcaption{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:4px}
.note{background:var(--wn);border:1px solid var(--wnb);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:14.5px}
.note.i{background:var(--ac2);border-color:var(--ac)}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--bd);cursor:pointer}
label.ck input{margin-top:5px;width:18px;height:18px;flex:none}
label.ck.d span{text-decoration:line-through;color:var(--mut)}
.pg{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.pg i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--ac);color:#fff;text-align:left;padding:8px 10px;white-space:nowrap}
:root[data-theme="dark"] th{color:#06223d}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
tbody tr:nth-child(even){background:var(--ac2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%}
.f.w{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:28px;line-height:1.1;color:var(--ac)}
.kpi span{font-size:13px;color:var(--mut)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bar div{height:16px;border-radius:5px;background:var(--ac)}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--bd);margin:8px 0}
.stack div{height:100%}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}
.mut{color:var(--mut);font-size:13.5px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:18px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 12px 24px}
</style></head><body>
<header class="hero"><div class="wrap"><h1>Manual técnico y procedimiento operativo</h1>

const COMP=[["Sonda robusta de inserción","Permite ingresar al interior de la tubería para realizar la inspección y captación de señales."],["Cabezal de inspección","Aloja el elemento sensor o cámara, según la configuración del fabricante."],["Cable o línea de conexión","Comunica la sonda con la unidad receptora o de control."],["Unidad de inserción metálica","Sirve de soporte y guía para introducir y retirar la sonda."],["Bridas y adaptadores","Permiten realizar la conexión mecánica con el punto de acceso de la tubería."],["Empaques y sellos","Proporcionan estanqueidad en las uniones correspondientes."],["Unidad receptora","Recibe y procesa las señales procedentes de la sonda."],["Computador portátil","Permite ejecutar el software de operación y visualizar los datos."],["Accesorios de conexión","Permiten interconectar los diferentes componentes."]];
const MANT=[["Sonda","Limpieza e inspección de daños físicos."],["Cabezal","Verificación de integridad y limpieza."],["Cable o línea azul","Inspección de cortes, dobleces y conexiones."],["Unidad de inserción","Revisión de mecanismos y partes móviles."],["Bridas","Inspección de superficies y tornillería."],["Empaques","Comprobar desgaste y deformaciones."],["Unidad receptora","Limpieza y verificación de funcionamiento."],["Computador","Revisar software, batería y almacenamiento."],["Conectores","Verificar limpieza, humedad y estado físico."]];
const SEC=[
{id:"s1",t:"1. Introducción",o:1,b:[["p","El sistema de cámara y sonda de inspección interna es un equipo utilizado para evaluar el interior de tuberías de redes de distribución de agua potable, con el propósito de identificar posibles anomalías y obtener información que facilite la localización de fugas."],["p","Utiliza una sonda de construcción robusta que se introduce de forma controlada por un punto de acceso habilitado. Mediante el conjunto de sensores y el sistema de recepción, la información puede visualizarse y analizarse desde un computador."],["p","El procedimiento complementa la detección tradicional con geófonos, correladores y otros equipos de diagnóstico."],["note","Importante:","las fotografías permiten identificar el conjunto metálico de inserción, la conexión a la tubería y una línea o cable azul. No permiten confirmar marca, modelo, presión máxima de trabajo, tipo exacto de sensor ni conexiones electrónicas. Este manual es un procedimiento operativo preliminar que debe contrastarse con las instrucciones del fabricante antes de operar el equipo."]]},
{id:"s2",t:"2. Componentes y accesorios del sistema",b:[["img",3,"Figura 1. Unidad de inserción metálica con brida, cabezal y sonda."],["tbl","comp"]]},
{id:"s3",t:"3. Objetivos del procedimiento",b:[["ul",["Establecer las condiciones necesarias para preparar el equipo antes de iniciar una inspección.","Describir la instalación y conexión de los accesorios.","Definir la secuencia de inserción y extracción de la sonda.","Explicar la puesta en funcionamiento del computador y la unidad receptora.","Establecer las condiciones para observar, registrar y analizar la información.","Evitar daños en la sonda, los sensores y los componentes de conexión.","Garantizar condiciones seguras durante las actividades de campo."]]]},
{id:"s4",t:"4. Protección personal y seguridad",b:[["h","Elementos de protección personal"],["chk",["Casco de seguridad","Gafas de protección","Guantes de seguridad apropiados para la actividad","Botas de seguridad","Chaleco reflectivo","Protección auditiva cuando las condiciones lo requieran"]],["h","Condiciones de seguridad fundamentales"],["ul",["Verificar que el punto de acceso esté autorizado y que la intervención cuente con el procedimiento de trabajo aprobado.","Identificar la presión de operación de la tubería.","No desmontar tapas, bridas ni conexiones sometidas a presión.","Utilizar únicamente adaptadores, sellos y sistemas de inserción certificados para la presión y el diámetro de la instalación.","Nunca introducir la sonda directamente en una tubería presurizada mediante una conexión improvisada.","Si el equipo trabaja bajo presión, usar exclusivamente su sistema de inserción y aislamiento especificado por el fabricante.","Mantener los equipos electrónicos protegidos del agua y la humedad.","Evitar dobleces, torsiones y golpes en la sonda y su cable."]]]},
{id:"s5",t:"5. Preparación del equipo antes de la inspección",b:[["h","5.1 Revisión de la sonda"],["chk",["Retirar cuidadosamente la sonda de su embalaje","Verificar que el cuerpo metálico no presente golpes, deformaciones o fisuras","Revisar que el cabezal no tenga daños","Inspeccionar el cable o línea azul: cortes, aplastamientos o dobleces","Verificar que los conectores estén limpios y secos","Comprobar que el mecanismo de desplazamiento funcione"]],["h","5.2 Revisión de los accesorios"],["chk",["Adaptadores para conexión a la tubería","Bridas de acoplamiento","Tornillería y elementos de fijación","Empaques y juntas de estanqueidad","Elementos de sujeción","Cables de comunicación","Unidad receptora","Computador portátil","Cargadores y baterías"]],["h","5.3 Preparación del punto de acceso"],["chk",["Diámetro y tipo de conexión","Compatibilidad del adaptador","Estado de la válvula o dispositivo de acceso","Condiciones hidráulicas de la tubería","Presión de trabajo","Espacio disponible para instalar el mecanismo de inserción"]]]},
{id:"s6",t:"6. Instalación de la unidad de inserción",b:[["p","La unidad de inserción es el conjunto mecánico que permite introducir y retirar la sonda de manera controlada."],["img",2,"Figura 2. Conexión de la sonda y la unidad de inserción a la brida del punto de acceso."],["chk",["Identificar el punto de acceso donde se realizará la inspección","Verificar que la conexión corresponda al diámetro y tipo de adaptador del equipo","Revisar las superficies de contacto y los empaques","Instalar el adaptador siguiendo las instrucciones del fabricante","Alinear correctamente las bridas","Instalar la tornillería y ajustar conforme a las especificaciones del fabricante","Verificar el sistema de estanqueidad","Comprobar que el mecanismo de inserción esté asegurado"]],["note","Precaución:","no realizar ajustes, desmontajes ni aperturas de válvulas bajo presión sin el sistema de inserción presurizado certificado y el procedimiento de seguridad correspondiente."]]},
{id:"s7",t:"7. Introducción de la sonda",b:[["p","Es una de las etapas más importantes: introduce el elemento sensor en el interior de la conducción."],["h","7.1 Introducción inicial"],["chk",["Verificar que la sonda esté conectada correctamente al sistema de inserción","Comprobar que el cable de comunicación esté conectado según el equipo","Confirmar que el punto de acceso esté habilitado","Posicionar la sonda en el mecanismo de inserción","Alinear el cabezal con el eje de la tubería","Iniciar el desplazamiento de manera lenta y controlada","Evitar movimientos bruscos o esfuerzos excesivos"]],["img",4,"Figura 3. Equipo de escucha con unidad de control, sensores, audífonos y accesorios."],["h","7.2 Profundidad de inserción"],["p","Según la descripción suministrada, se contempla una introducción inicial de aproximadamente <b>6 a 12 pulgadas (15 a 30 cm)</b>. Es una referencia de trabajo pendiente de validación con el fabricante: no es una profundidad máxima ni una distancia universal."],["p","El avance depende de:"],["ul",["Diseño de la sonda","Diámetro interno de la tubería","Tipo de sensor","Condiciones hidráulicas","Longitud de inserción permitida","Características del mecanismo de seguridad"]],["h","7.3 Durante la inserción"],["ul",["Mantener control permanente sobre el desplazamiento.","Evitar que la sonda golpee las paredes internas.","Observar cualquier resistencia anormal.","Revisar que el cable no se enrolle.","Mantener comunicación con el técnico encargado del computador.","Registrar las distancias de inserción cuando el equipo permita medirlas."]],["note","Alto:","si hay resistencia inesperada, vibración anormal o pérdida de comunicación, detener la operación y revisar las condiciones antes de continuar."]]},
{id:"s8",t:"8. Instalación y operación del computador",b:[["p","El computador es la interfaz de operación y visualización: ejecuta el software que recibe, muestra y registra la información de la inspección."],["img",5,"Figura 4. Operación del computador y visualización del software de inspección."],["h","8.1 Preparación del computador"],["chk",["Ubicar el computador en una superficie estable y protegida","Verificar el nivel de batería","Encender el computador","Iniciar el software suministrado por el fabricante","Verificar que el programa reconozca los dispositivos conectados","Revisar los parámetros de comunicación","Comprobar la comunicación con la unidad receptora"]],["h","8.2 Verificación del software"],["chk",["Reconocimiento de la sonda","Estado de conexión","Recepción de datos","Visualización de imágenes o señales","Disponibilidad de las herramientas de registro","Almacenamiento de los archivos de inspección"]],["h","8.3 Visualización de la información"],["p","Según las funciones reales del equipo, puede incluir imágenes del interior de la tubería, señales acústicas, variaciones de intensidad, gráficas de comportamiento, indicadores de funcionamiento y registros de las mediciones."],["note","Nota:","no debe interpretarse cualquier variación de señal como una fuga confirmada. Es necesario contrastar los resultados con las condiciones hidráulicas y las demás evidencias de campo.","i"]]},
{id:"s9",t:"9. Operación de la unidad receptora",b:[["p","La unidad receptora recibe las señales transmitidas por el conjunto de inspección y las comunica al computador."],["img",6,"Figura 5. Unidad de control y recepción con pantalla, carrete de cable y cabezal de cámara."],["chk",["Verificar el estado físico de la unidad receptora","Revisar los conectores de entrada y salida","Conectar la unidad al computador con el cable o sistema de comunicación correspondiente","Conectar la sonda según el esquema del fabricante","Encender la unidad receptora","Comprobar que los indicadores de funcionamiento estén activos","Verificar la comunicación entre la unidad receptora y el computador","Realizar una prueba inicial de recepción","Confirmar que la señal recibida sea estable","Iniciar el registro de información"]],["note","Recomendación:","no modificar parámetros de sensibilidad, ganancia, filtrado o amplificación sin conocer su función y los valores recomendados por el fabricante.","i"]]},
{id:"s10",t:"10. Escucha e identificación de posibles fugas",b:[["chk",["Confirmar que la sonda esté en la posición de trabajo","Verificar que el sistema esté recibiendo información","Iniciar la adquisición de señales","Observar el comportamiento de la información en el computador","Identificar variaciones o patrones asociados a una anomalía","Registrar las condiciones de operación","Repetir la medición para comprobar la estabilidad de la señal","Comparar resultados en diferentes posiciones de inspección","Documentar los hallazgos","Recomendar verificación complementaria si hay sospecha de fuga"]],["h","Aspectos que deben analizarse"],["ul",["Cambios en la intensidad de la señal","Sonidos o patrones acústicos anormales","Variaciones durante el desplazamiento","Repetibilidad de las mediciones","Correspondencia con las condiciones de presión y caudal"]],["p","La identificación definitiva de una fuga requiere validar los resultados con los métodos de diagnóstico y confirmación establecidos por el acueducto."]]},
{id:"s11",t:"11. Retiro de la sonda y finalización",b:[["p","El retiro debe hacerse con el mismo cuidado que la introducción."],["chk",["Detener la adquisición de información","Guardar los registros obtenidos","Verificar que la sonda pueda retirarse de manera segura","Accionar el mecanismo de extracción según el fabricante","Retirar la sonda lentamente","Evitar golpes contra las paredes y los accesorios","Limpiar externamente la sonda con productos compatibles","Desconectar los cables","Apagar la unidad receptora","Cerrar el software y apagar el computador","Desmontar el conjunto solo con las condiciones de aislamiento y seguridad cumplidas","Revisar los componentes antes de almacenarlos"]]]},
{id:"s12",t:"12. Mantenimiento preventivo",b:[["p","Marque cada elemento cuando se haya revisado; se guarda la fecha."],["tbl","mant"]]},
